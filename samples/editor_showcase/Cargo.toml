[package]
name = "editor_showcase"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
bevy = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false, features = ["3d", "serialize", "png", "jpeg", "tonemapping_luts"] }

[profile.dev]
opt-level = 1
debug = 0

[profile.dev.package."*"]
opt-level = 3
debug = 0
