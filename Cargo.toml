[package]
name = "bevy_editor"
version = "0.1.0"
edition = "2024"
description = "A minimal, modular, extensible Bevy Scene Editor & Multi-Platform Exporter"

[lib]
name = "bevy_editor_lib"
path = "src/lib.rs"

[[bin]]
name = "bevy_editor"
path = "src/main.rs"

[[bin]]
name = "bevylite"
path = "src/bin/bevylite.rs"

[features]
default = ["feathers", "gltf", "gizmos"]

# ⚡ Minimal Lite: Just the 3D viewport, camera, and basic primitives (~120 crates)
lite = []

# 🎨 Standard Editor UI: Inspector, Feathers theme, and 3D transform gizmos
feathers = ["bevy/bevy_feathers", "bevy/bevy_inspector"]
gizmos = ["bevy/bevy_gizmos_render"]
gltf = ["bevy/bevy_gltf", "bevy/png", "bevy/jpeg"]

# 🌐 Pro Features: Remote AI/MCP bridge and high-res compressed textures
remote = ["bevy/bevy_remote"]
compressed_textures = ["bevy/ktx2", "bevy/dds", "bevy/webp"]
solari = ["bevy/bevy_solari"]

# 🚀 Ultra-fast iterative developer linking (re-links in 1-2s)
dynamic_linking = ["bevy/dynamic_linking"]

[dependencies]
bevy = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false, features = [
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_render",
    "bevy_winit",
    "bevy_asset",
    "bevy_scene",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_text",
    "bevy_camera_controller",
    "free_camera",
    "tonemapping_luts",
    "zstd_rust",
    "custom_cursor",
    "bevy_state",
    "picking",
    "bevy_log",
    "sysinfo_plugin",
    "default_font",
    "system_font_discovery",
    "serialize",
    "debug",
] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 3
debug = 0

