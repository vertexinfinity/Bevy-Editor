[package]
name = "bevy_editor"
version = "0.1.0"
edition = "2024"
description = "A minimal, modular, extensible Bevy Scene Editor & Multi-Platform Exporter"

[lib]
name = "bevy_editor_lib"
path = "src/lib.rs"

[[bin]]
name = "bevy_editor"
path = "src/main.rs"

[[bin]]
name = "bevylite"
path = "src/bin/bevylite.rs"

[dependencies]
bevy = { path = "../Engine/bevy", default-features = true, features = [
    "bevy_inspector",
    "bevy_feathers",
    "bevy_camera_controller",
    "free_camera",
    "bevy_scene",
    "bevy_remote",
    "serialize",
    "debug",
    "jpeg",
    "png",
    "webp",
    "bmp",
    "tga",
    "ktx2",
    "dds",
] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 3
debug = 0

