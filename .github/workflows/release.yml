name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: bevylite.exe
            asset_bundle_type: zip
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bin_name: bevylite
            asset_bundle_type: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            bin_name: bevylite
            asset_bundle_type: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            bin_name: bevylite
            asset_bundle_type: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libvulkan-dev

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --bin bevylite --target ${{ matrix.target }}

      - name: Package Release Assets (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF -replace "refs/tags/", "" } else { "latest" }
          $archiveName = "bevylite-${tag}-${{ matrix.target }}"
          $stageDir = "dist/$archiveName"
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          
          Copy-Item "target/${{ matrix.target }}/release/bevylite.exe" -Destination $stageDir/
          if (Test-Path "assets") {
            Copy-Item -Path "assets" -Destination "$stageDir/assets" -Recurse
          }
          Copy-Item "README.md", "LICENSE-MIT", "LICENSE-APACHE" -Destination $stageDir/
          
          Compress-Archive -Path "$stageDir/*" -DestinationPath "dist/${archiveName}.zip" -Force
          echo "ARCHIVE_PATH=dist/${archiveName}.zip" >> $env:GITHUB_ENV

      - name: Package Release Assets (Unix / macOS)
        if: runner.os != 'Windows'
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          [ "$TAG" = "$GITHUB_REF" ] && TAG="latest"
          ARCHIVE_NAME="bevylite-${TAG}-${{ matrix.target }}"
          STAGE_DIR="dist/${ARCHIVE_NAME}"
          mkdir -p "${STAGE_DIR}"
          
          cp "target/${{ matrix.target }}/release/bevylite" "${STAGE_DIR}/"
          chmod +x "${STAGE_DIR}/bevylite"
          if [ -d "assets" ]; then
            cp -r assets "${STAGE_DIR}/"
          fi
          cp README.md LICENSE-MIT LICENSE-APACHE "${STAGE_DIR}/"
          
          tar -czvf "dist/${ARCHIVE_NAME}.tar.gz" -C dist "${ARCHIVE_NAME}"
          echo "ARCHIVE_PATH=dist/${ARCHIVE_NAME}.tar.gz" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bevylite-${{ matrix.target }}
          path: ${{ env.ARCHIVE_PATH }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Collect Release Files
        run: |
          mkdir -p dist
          find release-artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} dist/ \;
          ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
